# Guard: scan uv.lock for known vulnerabilities once a week.
# Pushes and pull requests are already scanned: verify.yml runs make verify,
# and make verify runs make audit. This job catches advisories that appear
# when the code does not change. See SECURITY.md section 5.3.
name: Audit
on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.14.4'
          version: '0.13.6'
      - run: make audit
